<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ratklao Pholpikul — Electronics Engineering (Computer) student at KMUTNB and incoming Security Engineer Intern. Projects, experience and contact." />
    <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1640" media="(prefers-color-scheme: dark)" />
    <script src="/theme-init.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;600&display=swap" rel="stylesheet" />
    <title>Ratklao Pholpikul — Field Notes</title>
    <!-- Preloader styles live here (not styles.css) so they apply before any JS/CSS bundle loads.
         Inline <style> is allowed by the CSP; inline <script> is not, so main.jsx removes it. -->
    <style>
      /* Opening screen: a counter runs to 100 while a few words flick past, then the
         whole sheet lifts off the top. The counter is a CSS-animated custom property. */
      @property --pl-n { syntax: '<integer>'; initial-value: 0; inherits: false; }
      #preloader {
        --pl-paper: #F4F6FB; --pl-ink: #0B1640; --pl-accent: #1B3A9C; --pl-muted: #55628F;
        --pl-time: 1.7s; --pl-ease: cubic-bezier(.3, .6, .2, 1);
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        background: var(--pl-paper); color: var(--pl-ink);
        transition: transform .95s cubic-bezier(.76, 0, .24, 1);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #preloader { --pl-paper: #0B1640; --pl-ink: #EDF1FF; --pl-accent: #FFD23F; --pl-muted: #9DAAD8; }
      }
      :root[data-theme="dark"] #preloader { --pl-paper: #0B1640; --pl-ink: #EDF1FF; --pl-accent: #FFD23F; --pl-muted: #9DAAD8; }
      #preloader.is-done { transform: translateY(-100%); }
      #preloader .pl-inner {
        height: 100%; display: flex; flex-direction: column; justify-content: space-between;
        padding: clamp(20px, 4vh, 40px) clamp(16px, 4vw, 48px) clamp(24px, 6vh, 56px);
        transition: opacity .4s ease, transform .6s cubic-bezier(.76, 0, .24, 1);
      }
      #preloader.is-done .pl-inner { opacity: 0; transform: translateY(-60px); }
      #preloader .pl-row { display: flex; justify-content: space-between; gap: 16px;
        font: 500 12px/1.4 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--pl-muted); }
      #preloader .pl-words { height: 1.1em; overflow: hidden;
        font: italic 300 clamp(40px, 7vw, 96px)/1.1 'Fraunces', Georgia, serif; letter-spacing: -.03em; }
      #preloader .pl-words span { display: block; }
      #preloader .pl-words span:last-child { color: var(--pl-accent); }
      #preloader .pl-track { animation: pl-words var(--pl-time) var(--pl-ease) forwards; }
      @keyframes pl-words {
        0%, 16% { transform: translateY(0); }
        26%, 42% { transform: translateY(-1.1em); }
        52%, 68% { transform: translateY(-2.2em); }
        78%, 100% { transform: translateY(-3.3em); }
      }
      #preloader .pl-bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
      #preloader .pl-count {
        counter-reset: pl var(--pl-n); animation: pl-count var(--pl-time) var(--pl-ease) forwards;
        font: 300 clamp(96px, 20vw, 260px)/.78 'Fraunces', Georgia, serif; letter-spacing: -.05em; font-variant-numeric: tabular-nums;
      }
      #preloader .pl-count::before { content: counter(pl); }
      #preloader .pl-count small { font-size: .3em; letter-spacing: 0; color: var(--pl-accent); }
      @keyframes pl-count { to { --pl-n: 100; } }
      #preloader .pl-bar { height: 1px; margin-top: 18px; background: currentColor; transform-origin: left;
        animation: pl-bar var(--pl-time) var(--pl-ease) forwards; transform: scaleX(0); }
      @keyframes pl-bar { to { transform: scaleX(1); } }
      @media (prefers-reduced-motion: reduce) {
        #preloader { transition: opacity .4s ease; }
        #preloader.is-done { transform: none; opacity: 0; }
        #preloader .pl-track { animation: none; transform: translateY(-3.3em); }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite" aria-label="Loading">
      <div class="pl-inner" aria-hidden="true">
        <div class="pl-row"><span>Field Notes — No. 01</span><span>Bangkok · UTC+7</span></div>
        <div class="pl-words"><div class="pl-track"><span>Hardware.</span><span>Networks.</span><span>Code.</span><span>Security.</span></div></div>
        <div>
          <div class="pl-bottom">
            <span class="pl-row">Ratklao Pholpikul<br />Portfolio</span>
            <span class="pl-count"><small>%</small></span>
          </div>
          <div class="pl-bar"></div>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
