<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ratklao Pholpikul — Computer Engineering student at KMUTNB and incoming Security Engineer Intern. Projects, experience and contact." />
    <meta name="theme-color" content="#F1ECE2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)" />
    <script src="/theme-init.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Instrument+Sans:wght@400..600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="preload" href="/profile.jpg" as="image" fetchpriority="high" />
    <title>Ratklao Pholpikul — Field Notes</title>
    <!-- Preloader styles live here (not styles.css) so they apply before any JS/CSS bundle loads.
         Inline <style> is allowed by the CSP; inline <script> is not, so main.jsx removes it. -->
    <style>
      #preloader {
        --pl-paper: #F1ECE2; --pl-ink: #171513; --pl-accent: #C23B22;
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column; justify-content: flex-end; gap: 14px;
        padding: 0 clamp(16px, 4vw, 48px) clamp(24px, 6vh, 56px);
        background: var(--pl-paper); color: var(--pl-ink);
        transition: opacity .6s ease, visibility .6s;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) #preloader { --pl-paper: #14120F; --pl-ink: #EDE6D8; --pl-accent: #E2583D; }
      }
      :root[data-theme="dark"] #preloader { --pl-paper: #14120F; --pl-ink: #EDE6D8; --pl-accent: #E2583D; }
      #preloader.is-done { opacity: 0; visibility: hidden; }
      #preloader .pl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
        font: 500 12px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: .06em; text-transform: uppercase; }
      #preloader .pl-no { font: italic 300 clamp(96px, 22vw, 280px)/.8 'Fraunces', Georgia, serif; letter-spacing: -.04em; }
      #preloader .pl-no span { color: var(--pl-accent); }
      #preloader .pl-bar { height: 1px; background: currentColor; transform-origin: left;
        animation: pl-fill 1.1s cubic-bezier(.2, .7, .1, 1) infinite; }
      @keyframes pl-fill { 0% { transform: scaleX(0); } 60% { transform: scaleX(1); transform-origin: left; }
        61% { transform-origin: right; } 100% { transform: scaleX(0); transform-origin: right; } }
      @media (prefers-reduced-motion: reduce) { #preloader .pl-bar { animation: none; } }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-live="polite">
      <div class="pl-no" aria-hidden="true">No. 01<span>.</span></div>
      <div class="pl-bar" aria-hidden="true"></div>
      <div class="pl-row"><span>Field Notes</span><span>Loading the issue…</span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
