# Netlify build + hosting config (the Netlify twin of vercel.json).
# In the Netlify UI set only "Base directory" to `portfolio`; everything else comes from here.

[build]
  command = "npm run build"
  publish = "dist" # relative to the base directory

[build.environment]
  NODE_VERSION = "22" # Vite 8 needs Node 20.19+ / 22.12+

# A missing hashed asset (an old chunk after a redeploy) must be a real 404, not the app's
# index.html — otherwise the browser tries to run HTML as JavaScript. Listed first so it
# wins over the SPA fallback below.
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

# Single-page app: every other path (e.g. /contact on refresh) is served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://api.emailjs.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

# Vite's assets have content hashes in their names, so they can be cached for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
